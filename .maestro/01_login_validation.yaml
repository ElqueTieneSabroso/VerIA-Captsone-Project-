appId: host.exp.exponent
name: Validación del formulario de acceso
tags:
  - smoke
  - validation
---
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 20000
- assertVisible:
    id: login-email-input
- assertVisible:
    id: login-password-input
- tapOn:
    id: login-submit-button
- assertVisible: Campos incompletos
- assertVisible: Ingrese su correo y contraseña.
- tapOn: OK
- tapOn:
    id: login-email-input
- inputText: correo-invalido
- tapOn:
    id: login-password-input
- inputText: Veria_123!
- hideKeyboard
- tapOn:
    id: login-submit-button
- assertVisible: Correo inválido
- assertVisible: Ingrese un correo electrónico válido.
- tapOn: OK
- assertVisible:
    id: login-register-link
